<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Reviews</title>
</head>
<body>

    <main>
        <section class="container">
            <!-- title -->
            <div class="title">
                <h2>Our Reviews</h2>
                <div class="underline"></div>
            </div>
            <!-- review -->
             <article class="review">
                <div class="img-container">
                    <img src="" id="person-img" alt="">
                </div>
                <h4 id="author">sara jones</h4>
                <p id="job">UX Designer</p>
                <p id="info">
                    Lorem ipsum dolor sit amet consectetur adipisicing elit. Eaque quibusdam nisi, repellat quas odit saepe quasi veniam, incidunt similique ex illo repellendus. Deserunt soluta alias quidem pariatur corrupti unde incidunt?
                </p>

                <!-- prev next buttons -->
                 <div class="button-container">
                    <button class="prev-btn">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button class="next-btn">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                 </div>
                 <!-- random btn -->
                  <button class="random-btn">Suprise me</button>
             </article>
        </section>
    </main>
    

    <script src="index.js"></script>
</body>
</html>
